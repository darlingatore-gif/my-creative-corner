const blank=()=>({version:4,theme:'blush',books:[],logs:[],collections:COLLECTION_DEFAULT.map(([id,emoji,name,description])=>({id,emoji,name,description,bookIds:[]})),awards:{},awardCategories:[],goal:40});
function normalizeBook(b){const finished=b.finishedAt||b.dateFinished||'';return {id:b.id||uid(),title:String(b.title||'Livre sans titre'),author:String(b.author||''),isbn:b.isbn||'',cover:validUrl(b.cover||''),genre:b.genre||'Autre',format:b.format||'Papier',pages:Math.max(0,Number(b.pages)||0),series:b.series||'',status:b.status|| (finished?'done':'tbr'),rating:Math.max(0,Math.min(5,Number(b.rating)||0)),spice:Math.max(0,Math.min(5,Number(b.spice)||0)),emotion:Math.max(0,Math.min(5,Number(b.emotion)||0)),romance:Math.max(0,Math.min(5,Number(b.romance)||0)),plot:Math.max(0,Math.min(5,Number(b.plot)||0)),favorite:!!b.favorite,startedAt:b.startedAt||'',finishedAt:finished,notes:b.notes||'',quote:b.quote||'',tags:b.tags||'',createdAt:b.createdAt||TODAY()}}
function normalize(raw){if(!raw||!Array.isArray(raw.books))throw Error('Sauvegarde non reconnue');const o=blank();o.theme=['blush','lilac','sage','mocha'].includes(raw.theme)?raw.theme:'blush';o.goal=Math.max(1,Number(raw.goal)||40);o.books=raw.books.map(normalizeBook);o.logs=(Array.isArray(raw.logs)?raw.logs:[]).filter(l=>l.bookId).map(l=>({id:l.id||uid(),bookId:l.bookId,date:l.date||TODAY(),pages:Math.max(0,Number(l.pages)||0),note:l.note||''}));if(Array.isArray(raw.collections)){o.collections=raw.collections.filter(x=>x.name).map(x=>({id:x.id||uid(),emoji:x.emoji||'🎀',name:x.name,description:x.description||'',bookIds:Array.isArray(x.bookIds)?x.bookIds:[]}));for(const d of COLLECTION_DEFAULT)if(!o.collections.some(x=>x.id===d[0]))o.collections.push({id:d[0],emoji:d[1],name:d[2],description:d[3],bookIds:[]});}
 // Les journaux de l'ancienne version permettent de reconnaître les lectures en cours.
 if(Number(raw.version)!==4)for(const b of o.books){if(!b.finishedAt&&b.status==='tbr'&&o.logs.some(l=>l.bookId===b.id&&l.pages>0))b.status='reading';}
 o.awards=raw.awards&&typeof raw.awards==='object'?raw.awards:{};o.awardCategories=Array.isArray(raw.awardCategories)?raw.awardCategories:[];return o;}
function load(){try{let s=localStorage.getItem(KEY);if(s)return normalize(JSON.parse(s));for(const k of LEGACY){let x=localStorage.getItem(k);if(x){let n=normalize(JSON.parse(x));localStorage.setItem(KEY,JSON.stringify(n));return n;}}}catch(e){console.warn(e)}return blank()}
let db=load(),ui={view:'home',filter:'all',search:'',sort:'recent',year:new Date().getFullYear(),collection:'',bestMetric:'rating',bestGenre:'all',bestYear:'all',online:[],scanner:null};
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast('Stockage limité : pense à exporter tes données.');return false}}
function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('visible');clearTimeout(toast.timer);toast.timer=setTimeout(()=>x.classList.remove('visible'),2600)}
const bookBy=id=>db.books.find(b=>b.id===id),statLabel=s=>STATUSES.find(x=>x[0]===s)?.[1]||s;
const totalPages=b=>db.logs.filter(l=>l.bookId===b.id).reduce((s,l)=>s+Number(l.pages||0),0);
function doneForYear(y){return db.books.filter(b=>b.status==='done'&&b.finishedAt?.startsWith(String(y)))}
function bookCover(b){return `<div class="book-cover">${b.cover?`<img src="${attr(b.cover)}" loading="lazy" alt="Couverture de ${attr(b.title)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="placeholder" style="display:none"><span class="flower">✿</span><b>${esc(b.title)}</b><small>${esc(b.author)}</small></div>`:`<div class="placeholder"><span class="flower">✿</span><b>${esc(b.title)}</b><small>${esc(b.author)}</small></div>`}${b.favorite?'<span class="heart-bubble">♥</span>':''}</div>`}
function bookCard(b){return `<article class="book" tabindex="0" role="button" data-action="show-book" data-id="${attr(b.id)}">${bookCover(b)}<div class="book-title">${esc(b.title)}</div><div class="book-author">${esc(b.author||'Auteur inconnu')}</div><div class="book-meta">${b.rating?`<span class="stars">★ ${b.rating}/5</span>`:''}${b.status==='reading'?'<span class="chip">En cours</span>':''}</div></article>`}
const empty=(emoji,title,copy,btn='')=>`<div class="empty"><div class="big">${emoji}</div><h3>${title}</h3><p>${copy}</p>${btn}</div>`;
function section(title,right,body){return `<section class="section"><div class="section-title"><h2>${title}</h2>${right||''}</div>${body}</section>`}
function navRender(){const nav=where=>NAV.filter(x=>where==='bottom'?['home','books','collections','awards','stats'].includes(x[0]):true).map(([v,e,t])=>`<button class="${ui.view===v?'active':''}" data-view="${v}"><span class="emoji">${e}</span>${t}</button>`).join('');$('#sidebarNav').innerHTML=nav('sidebar');$('#bottomNav').innerHTML=nav('bottom')}
function topText(){const dict={home:['Bonjour, lectrice ♡','Un cocon pour toutes tes histoires préférées.'],books:['Ma bibliothèque 📚','Tous tes livres, tous tes univers.'],collections:['Mes collections 💗','Classe tes lectures comme tu en as envie.'],awards:['Mes Book Awards 🏆','Célèbre les histoires qui ont marqué ton année.'],bestof:['Mon Best Of ✨','Le classement de tes lectures inoubliables.'],stats:['Mes statistiques 📊','Ton année de lecture, en belles données.'],journal:['Mon journal 🖋️','Chaque petite page compte.'],settings:['Mon petit atelier 🎨','Rends ton carnet encore plus toi.']};let d=dict[ui.view]||dict.home;$('#pageTitle').textContent=d[0];$('#pageSubtitle').textContent=d[1]}

function overview(){const d=doneForYear(ui.year),rated=d.filter(x=>x.rating>0),tot=d.reduce((s,b)=>s+(+b.pages||0),0),fav=d.filter(x=>x.favorite).length;return [{ico:'📚',num:d.length,lbl:'Livres terminés'},{ico:'📖',num:tot.toLocaleString('fr-FR'),lbl:'Pages lues'},{ico:'💗',num:fav,lbl:'Coups de cœur'},{ico:'⭐',num:rated.length?(rated.reduce((s,b)=>s+b.rating,0)/rated.length).toFixed(1).replace('.',','):'—',lbl:'Note moyenne'}]}
function renderHome(){const current=db.books.filter(b=>b.status==='reading'),fav=db.books.filter(b=>b.favorite),rec=db.books.filter(b=>b.status==='done').sort((a,b)=>(b.finishedAt||'').localeCompare(a.finishedAt||''));const ys=yearSelect();const trophy=db.awards[ui.year]?.book;return `<div class="hero"><div class="hero-copy"><span class="eyebrow">🌷 BIENVENUE CHEZ TOI</span><h2>Des pages, des émotions<br>et beaucoup d'amour ♡</h2><p>Ton histoire de lectrice s’écrit ici, un livre à la fois.</p></div><div class="hero-art"><svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg"><path d="M47 236 C70 170 62 130 122 67 M121 229 Q115 151 170 84 M122 228 Q161 161 204 144" fill="none" stroke="#af8e7d" stroke-width="4" stroke-linecap="round"/><g fill="#fff2f1" stroke="#c58b9d" stroke-width="2"><ellipse cx="117" cy="51" rx="14" ry="26" transform="rotate(-12 117 51)"/><ellipse cx="100" cy="65" rx="14" ry="25" transform="rotate(-55 100 65)"/><ellipse cx="127" cy="82" rx="14" ry="27" transform="rotate(50 127 82)"/><ellipse cx="144" cy="61" rx="13" ry="24" transform="rotate(50 144 61)"/><circle cx="123" cy="67" r="12" fill="#e4a6aa"/><ellipse cx="172" cy="67" rx="14" ry="24"/><ellipse cx="152" cy="85" rx="13" ry="24" transform="rotate(-40 152 85)"/><ellipse cx="180" cy="102" rx="13" ry="24" transform="rotate(42 180 102)"/><ellipse cx="197" cy="85" rx="13" ry="24" transform="rotate(55 197 85)"/><circle cx="175" cy="84" r="11" fill="#e4a6aa"/><ellipse cx="194" cy="128" rx="11" ry="20"/><ellipse cx="179" cy="142" rx="11" ry="20" transform="rotate(-45 179 142)"/><ellipse cx="200" cy="158" rx="11" ry="20" transform="rotate(35 200 158)"/><ellipse cx="217" cy="141" rx="11" ry="20" transform="rotate(56 217 141)"/><circle cx="199" cy="143" r="10" fill="#e4a6aa"/></g><g fill="#98a98c"><ellipse cx="82" cy="160" rx="12" ry="23" transform="rotate(-54 82 160)"/><ellipse cx="149" cy="169" rx="12" ry="22" transform="rotate(57 149 169)"/><ellipse cx="60" cy="198" rx="12" ry="22" transform="ro function renderBooks(){let arr=[...db.books];if(ui.filter==='favorite')arr=arr.filter(b=>b.favorite);else if(ui.filter!=='all')arr=arr.filter(b=>b.status===ui.filter);if(ui.search.trim()){let q=ui.search.toLowerCase();arr=arr.filter(b=>[b.title,b.author,b.isbn,b.genre,b.series,b.tags].some(s=>String(s||'').toLowerCase().includes(q)))}arr.sort(ui.sort==='title'?(a,b)=>a.title.localeCompare(b.title,'fr'):ui.sort==='rating'?(a,b)=>b.rating-a.rating:ui.sort==='old'?(a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''):(a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));return `<div class="toolbar"><input class="search" id="bookSearch" placeholder="🔎  Titre, auteur, série ou ISBN..." value="${attr(ui.search)}" aria-label="Chercher mes livres"><select class="field select" id="bookFilter" aria-label="Filtrer"><option value="all">Tous (${db.books.length})</option>${STATUSES.map(([v,t])=>`<option value="${v}" ${ui.filter===v?'selected':''}>${t}</option>`).join('')}<option value="favorite" ${ui.filter==='favorite'?'selected':''}>💗 Coups de cœur</option></select><select class="field select" id="bookSort" aria-label="Trier"><option value="recent" ${ui.sort==='recent'?'selected':''}>Récents</option><option value="title" ${ui.sort==='title'?'selected':''}>Titre A–Z</option><option value="rating" ${ui.sort==='rating'?'selected':''}>Meilleures notes</option><option value="old" ${ui.sort==='old'?'selected':''}>Plus anciens</option></select></div><div class="header-row"><span class="muted">${arr.length} livre${arr.length>1?'s':''} dans cette sélection</span><button class="btn soft" data-action="add-book">＋ Nouveau livre</button></div>${arr.length?`<div class="books-grid">${arr.map(bookCard).join('')}</div>`:empty('📚',ui.search?'Aucun livre trouvé':'Une bibliothèque à remplir','Recherche un autre terme ou ajoute une nouvelle lecture.',`<button class="btn primary" data-action="add-book">Ajouter un livre</button>`)}`}
function collectionIds(c){if(c.id==='favorites')return db.books.filter(b=>b.favorite).map(b=>b.id);if(c.id==='five')return db.books.filter(b=>b.rating===5).map(b=>b.id);return c.bookIds||[]}

 const metrics=[['rating','⭐ Mes meilleures notes'],['emotion','🥹 Mes lectures les plus émouvantes'],['romance','💕 Les plus belles romances'],['spice','🌶️ Mes lectures les plus spicy'],['plot','✨ Les meilleures intrigues']];

 ${section('👑 Mon Hall of Fame',`<span class="muted">${fave.length} coup(s) de cœur</span>`,fave.length?`<div class="books-grid">${fave.map(bookCard).join('')}</div>`:empty('💗','Tes favoris éternels','Marque les histoires qui t’ont bouleversée en coups de cœur pour construire ton Hall of Fame.',`<button class="btn primary" data-view="books">Choisir mes favoris</button>`))}

let searchCache=[];
function isbnClean(x){return String(x||'').replace(/[^0-9Xx]/g,'')}
async function searchOnline(q){q=(q||$('#catalogQuery')?.value||'').trim();let m=$('#catalogMatches');if(!q||!m)return toast('Écris un titre, un auteur ou un ISBN.');m.innerHTML='<p class="helper">Recherche des livres…</p>';try{let isIsbn=/^(\d{13}|\d{9}[\dX])$/.test(isbnClean(q));let url='https://openlibrary.org/search.json?'+(isIsbn?'isbn='+encodeURIComponent(isbnClean(q)):'q='+encodeURIComponent(q))+'&limit=12&fields=title,author_name,first_publish_year,number_of_pages_median,cover_i,isbn,key';let r=await fetch(url,{signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error('openlibrary');let j=await r.json();searchCache=(j.docs||[]).slice(0,10).map(x=>({title:x.title||'',author:(x.author_name||[]).slice(0,2).join(', '),pages:x.number_of_pages_median||0,cover:x.cover_i?`https://covers.openlibrary.org/b/id/${x.cover_i}-L.jpg`:'',isbn:(x.isbn||[]).find(s=>s.length===13)||x.isbn?.[0]||''}));if(!searchCache.length)throw Error('noresult');}catch(e){try{let r=await fetch('https://www.googleapis.com/books/v1/volumes?'+new URLSearchParams({q, maxResults:'8',printType:'books'}));if(!r.ok)throw Error();let j=await r.json();searchCache=(j.items||[]).map(x=>{let z=x.volumeInfo||{};return {title:z.title||'',author:(z.authors||[]).join(', '),pages:z.pageCount||0,cover:(z.imageLinks?.thumbnail||'').replace(/^http:/,'https:'),isbn:(z.industryIdentifiers||[]).find(i=>i.type==='ISBN_13')?.identifier||''}})}catch{searchCache=[]}}if(!m.isConnected)return;m.innerHTML=searchCache.length?searchCache.map((b,i)=>`<button type="button" class="search-result" data-action="pick-result" data-index="${i}">${b.cover?`<img src="${attr(b.cover)}" alt="">`:'📖'}<span><strong>${esc(b.title)}</strong><small>${esc(b.author)} ${b.pages?'· '+b.pages+' p.':''}</small></span></button>`).join(''):'<p class="helper">Aucun résultat. Tu peux tout saisir manuellement.</p>'}
function pickResult(i){let b=searchCache[i],f=$('#bookForm');if(!b||!f)return;for(const key of ['title','author','pages','cover','isbn'])if(b[key]&&f.elements[key])f.elements[key].value=b[key];$('#catalogMatches').innerHTML='<p class="notice">✨ Livre trouvé ! Vérifie les informations, puis enregistre-le.</p>';toast('Fiche préremplie ♡')}
async function scanPhoto(file){if(!file)return;if(!('BarcodeDetector' in window)){toast('Scan indisponible sur cet appareil. Saisis l’ISBN manuellement.');return}let img;try{img=await createImageBitmap(file);let det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a']});let results=await det.detect(img);img.close();let code=results.map(x=>x.rawValue).find(x=>/^97[89]\d{10}$/.test(x));if(!code)throw Error('no');$('#catalogQuery').value=code;searchOnline(code)}catch{toast('ISBN non détecté. Essaie une photo plus nette.')}}

function saveCollection(f){let c=db.collections.find(x=>x.id===f.dataset.id),v=formData(f),name=String(v.name||'').trim();if(!name)return toast('Donne un nom à ta collection.');let val={id:c?.id||uid(),name,emoji:v.emoji||'🎀',description:v.description||'',bookIds:[...f.querySelectorAll('input[name=selectedBook]:checked')].map(x=>x.value)};if(c)Object.assign(c,val);else db.collections.push(val);ui.collection=val.id;save();close();render();toast('Collection enregistrée ♡')}
function saveLogForm(f){let v=formData(f),p=Number(v.pages);if(!bookBy(v.bookId)||!Number.isInteger(p)||p<1||p>50000||!v.date||v.date>TODAY())return toast('Vérifie les pages et la date.');db.logs.push({id:uid(),bookId:v.bookId,date:v.date,pages:p,note:String(v.note||'').slice(0,250)});let b=bookBy(v.bookId);if(b.pages>0&&totalPages(b)>=b.pages&&b.status==='reading'){b.status='done';if(!b.finishedAt)b.finishedAt=v.date}save();close();render();toast(`${p} pages ajoutées au journal ♡`)}
function act(a,btn){const id=btn.dataset.id;switch(a){case'add-book':bookModal();break;case'edit-book':bookModal(id);break;case'show-book':showBook(id);break;case'close':close();break;case'add-log':logModal(id);break;case'toggle-fav':{let b=bookBy(id);if(b){b.favorite=!b.favorite;save();showBook(id);render()}break}case'delete-book':if(confirm('Supprimer ce livre et ses séances ?')){db.books=db.books.filter(b=>b.id!==id);db.logs=db.logs.filter(l=>l.bookId!==id);db.collections.forEach(c=>c.bookIds=c.bookIds.filter(x=>x!==id));Object.values(db.awards).forEach(y=>Object.keys(y).forEach(k=>{if(y[k]===id)delete y[k]}));save();close();render();toast('Livre supprimé.')}break;case'add-collection':collectionModal();break;case'edit-collection':collectionModal(id);break;case'collections-back':ui.collection='';render();break;case'delete-collection':if(confirm('Supprimer cette collection ?')){db.collections=db.collections.filter(c=>c.id!==id);ui.collection='';save();close();render()}break;case'add-award':awardModal();break;case'remove-award':if(confirm('Supprimer cette catégorie de récompense ?')){db.awardCategories=db.awardCategories.filter(a=>a.id!==id);Object.values(db.awards).forEach(o=>delete o[id]);save();render()}break;case'export':exportData();break;case'import':$('#importFile').click();break;case'reset':if(confirm('Cette action efface toutes tes données locales. As-tu exporté une sauvegarde ?')&&confirm('Dernière confirmation : tout effacer ?')){db=blank();ui.view='home';save();render();toast('Carnet réinitialisé.')}break;case'save-goal':{let n=Number($('#goalInput').value);if(!Number.isInteger(n)||n<1||n>9999)return toast('Objectif invalide.');db.goal=n;save();render();toast('Objectif enregistré.');break}case'search-online':searchOnline();break;case'pick-result':pickResult(+btn.dataset.index);break;case'scan-photo':$('#barcodePhoto').click();break;case'delete-log':if(confirm('Supprimer cette séance ?')){db.logs=db.logs.filter(l=>l.id!==id);save();render()}break;}}
function stopCamera(){if(ui.scanner){ui.scanner.getTracks().forEach(t=>t.stop());ui.scanner=null}}
document.addEventListener('click',e=>{if(e.target.classList.contains('modal-back'))return close();let b=e.target.closest('[data-action],[data-view]');if(!b)return;if(b.dataset.view){if(b.dataset.filter)ui.filter=b.dataset.filter;if(b.dataset.collection!==undefined)ui.collection=b.dataset.collection;else if(b.dataset.view==='collections')ui.collection='';go(b.dataset.view)}else act(b.dataset.action,b)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Enter'&&e.target.id==='catalogQuery'){e.preventDefault();searchOnline()}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-action]')){e.preventDefault();act(e.target.dataset.action,e.target)}});
document.addEventListener('submit',e=>{const f=e.target;if(!['bookForm','collectionForm','logForm','awardForm'].includes(f.id))return;e.preventDefault();if(f.id==='bookForm')saveBookForm(f);if(f.id==='collectionForm')saveCollection(f);if(f.id==='logForm')saveLogForm(f);if(f.id==='awardForm'){let v=formData(f);if(!String(v.name||'').trim())return;db.awardCategories.push({id:uid(),name:String(v.name).slice(0,80),emoji:v.emoji||'🏅'});save();close();render();toast('Nouvel award créé ♡')}});
document.addEventListener('change',e=>{let t=e.target;if(t.id==='bookFilter'){ui.filter=t.value;render()}if(t.id==='bookSort'){ui.sort=t.value;render()}if(t.id==='bestMetric'){ui.bestMetric=t.value;render()}if(t.id==='bestYear'){ui.bestYear=t.value;render()}if(t.id==='bestGenre'){ui.bestGenre=t.value;render()}if(t.id==='yearSelect'){ui.year=Number(t.value);render()}if(t.dataset.award){db.awards[ui.year]??={};if(t.value)db.awards[ui.year][t.dataset.award]=t.value;else delete db.awards[ui.year][t.dataset.award];save();render()}if(t.dataset.theme){db.theme=t.dataset.theme;save();render()}});
document.addEventListener('input',e=>{if(e.target.id==='bookSearch'){let pos=e.target.selectionStart;ui.search=e.target.value;const grid=$('#content');let raw=renderBooks();grid.innerHTML=raw;let input=$('#bookSearch');input.focus();input.setSelectionRange(pos,pos)}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-theme]');if(b){db.theme=b.dataset.theme;save();render();toast('Nouvelle ambiance appliquée ♡')}});
$('#importFile').addEventListener('change',async e=>{let file=e.target.files?.[0];if(!file)return;try{const raw=JSON.parse(await file.text()),newdb=normalize(raw);if(!confirm(`Importer ${newdb.books.length} livres ? Cette opération remplacera les données actuelles de ce navigateur.`))return;db=newdb;ui.view='home';ui.collection='';ui.search='';ui.filter='all';save();render();toast('Bibliothèque restaurée avec succès ♡')}catch(err){toast('Impossible d’ouvrir cette sauvegarde JSON.')}finally{e.target.value=''}});
$('#barcodePhoto').addEventListener('change',e=>{let f=e.target.files?.[0];if(f)scanPhoto(f);e.target.value=''});
render();
</script></body></html>
